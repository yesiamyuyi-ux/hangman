<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>吊死人猜字連線對戰 - 旗艦版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyB9QjUN5oTSEkOVd5p-6rJfZEoAFc-ns38",
      authDomain: "hangman-ce85a.firebaseapp.com",
      databaseURL: "https://hangman-ce85a-default-rtdb.firebaseio.com",
      projectId: "hangman-ce85a",
      storageBucket: "hangman-ce85a.firebasestorage.app",
      messagingSenderId: "473298738214",
      appId: "1:473298738214:web:f57f31f19dce05ee579ae7"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const ALPHABET_EN = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    // 注音符號按鈕（包含輕聲、二聲、三聲、四聲，一聲無符號）
    const ZHUYIN_LIST = ['ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ','ㄍ','ㄎ','ㄏ','ㄐ','ㄑ','ㄒ','ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ','ㄧ','ㄨ','ㄩ','ㄚ','ㄛ','ㄜ','ㄝ','ㄞ','ㄟ','ㄠ','ㄡ','ㄢ','ㄣ','ㄤ','ㄥ','ㄦ','˙','ˊ','ˇ','ˋ'];
    const MAX_WRONG = 6;

    // 擴充內建國字轉注音字典
    const ZHUYIN_DICT = {
      '柑': 'ㄍㄢ', '仔': 'ㄗㄞˇ', '店': 'ㄉㄧㄢˋ', '推': 'ㄊㄨㄟ', '冰': 'ㄅㄧㄥ', '壺': 'ㄏㄨˊ',
      '珍': 'ㄓㄣ', '珠': 'ㄓㄨ', '奶': 'ㄋㄞˇ', '茶': 'ㄔㄚˊ', '貓': 'ㄇㄠ', '狗': 'ㄍㄡˇ',
      '翻': 'ㄈㄢ', '樂': 'ㄌㄜˋ', '蘋': 'ㄆㄧㄥˊ', '果': 'ㄍㄨㄛˇ', '紅': 'ㄏㄨㄥˊ',
      '大': 'ㄉㄚˋ', '家': 'ㄐㄧㄚ', '好': 'ㄏㄠˇ', '心': 'ㄒㄧㄣ', '情': 'ㄑㄧㄥˊ',
      '快': 'ㄎㄨㄞˋ', '春': 'ㄔㄨㄣ', '水': 'ㄕㄨㄟˇ', '堂': 'ㄊㄤˊ', '長': 'ㄔㄤˊ',
      '照': 'ㄓㄠˋ', '學': 'ㄒㄩㄝˊ', '生': 'ㄕㄥ', '吉': 'ㄐㄧ', '祥': 'ㄒㄧㄤˊ',
      '話': 'ㄏㄨㄚˋ', '老': 'ㄌㄠˇ', '人': 'ㄖㄣˊ', '愛': 'ㄞˋ', '吃': 'ㄔ',
      '飯': 'ㄈㄢˋ', '喝': 'ㄏㄜ', '遊': 'ㄧㄡˊ', '戲': 'ㄒㄧˋ', '對': 'ㄉㄨㄟˋ',
      '戰': 'ㄓㄢˋ', '連': 'ㄌㄧㄢˊ', '線': 'ㄒㄧㄢˋ', '星': 'ㄒㄧㄥ', '期': 'ㄑㄧ',
      '日': 'ㄖˋ', '月': 'ㄩㄝˋ', '天': 'ㄊㄧㄢ', '地': 'ㄉㄧˋ', '福': 'ㄈㄨˊ'
    };

    // 清理與標準化注音字串：將一聲符號 (ˉ 或 1) 去除，避免玩家無法點擊
    function cleanZhuyinTarget(str) {
      if (!str) return '';
      return str
        .replace(/[ˉ1]/g, '') // 移除一聲符號
        .replace(/2/g, 'ˊ')
        .replace(/3/g, 'ˇ')
        .replace(/4/g, 'ˋ')
        .replace(/5/g, '˙')
        .trim();
    }

    // 自動轉換國字為注音，並去除一聲符號 conflict
    function autoConvertZhuyin(text) {
      if (!text) return '';
      const converted = text.split('').map(c => ZHUYIN_DICT[c] || c).join(' ');
      return cleanZhuyinTarget(converted);
    }

    // 初始預設題庫
    const DEFAULT_COLLECTIONS = [
      {
        id: 'c1', name: '懷舊與日常', lang: 'ZH',
        words: [
          { text: '柑仔店', target: 'ㄍㄢ ㄗㄞˇ ㄉㄧㄢˋ' },
          { text: '推冰壺', target: 'ㄊㄨㄟ ㄅㄧㄥ ㄏㄨˊ' },
          { text: '珍珠奶茶', target: 'ㄓㄣ ㄓㄨ ㄋㄞˇ ㄔㄚˊ' },
          { text: '小貓', target: 'ㄒㄧㄠˇ ㄇㄠ' }
        ]
      },
      {
        id: 'c2', name: 'Daily Phrases', lang: 'EN',
        words: [
          { text: 'APPLE PIE', target: 'APPLE PIE' },
          { text: 'ICE CREAM', target: 'ICE CREAM' },
          { text: 'GOOD MORNING', target: 'GOOD MORNING' }
        ]
      }
    ];

    function HangmanGame() {
      const [screen, setScreen] = useState('HOME');
      
      // ─── 單人模式 ───
      const [collections, setCollections] = useState(() => {
        const saved = localStorage.getItem('hangman_collections_v2');
        return saved ? JSON.parse(saved) : DEFAULT_COLLECTIONS;
      });
      const [spCurrentCol, setSpCurrentCol] = useState(null);
      const [spWordIndex, setSpWordIndex] = useState(0);
      const [spWordData, setSpWordData] = useState(null);
      const [spGuessed, setSpGuessed] = useState(new Set());
      const [spWrong, setSpWrong] = useState(0);

      // 單人合集編輯
      const [editingCol, setEditingCol] = useState(null);
      const [wordCountInput, setWordCountInput] = useState(3);

      // ─── 多人模式 ───
      const [roomIdInput, setRoomIdInput] = useState('');
      const [playerNameInput, setPlayerNameInput] = useState('');
      const [roomId, setRoomId] = useState('');
      const [playerId, setPlayerId] = useState('');
      const [playerName, setPlayerName] = useState('');
      const [roomData, setRoomData] = useState(null);
      const [langMode, setLangMode] = useState('ZH'); 
      
      const [mpWordText, setMpWordText] = useState('');
      const [mpWordTarget, setMpWordTarget] = useState('');
      
      const [timeLeft, setTimeLeft] = useState(0);
      const [showReview, setShowReview] = useState(false);

      const canvasRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('hangman_collections_v2', JSON.stringify(collections));
      }, [collections]);

      // 繪製 Hangman Canvas
      const drawHangman = useCallback((wrongCount) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#374151'; ctx.lineWidth = 4; ctx.lineCap = 'round';

        ctx.beginPath();
        ctx.moveTo(20, 180); ctx.lineTo(100, 180);
        ctx.moveTo(40, 180); ctx.lineTo(40, 20);
        ctx.lineTo(120, 20); ctx.lineTo(120, 40);
        ctx.stroke();

        if (wrongCount >= 1) { ctx.beginPath(); ctx.arc(120, 55, 15, 0, Math.PI * 2); ctx.stroke(); }
        if (wrongCount >= 2) { ctx.beginPath(); ctx.moveTo(120, 70); ctx.lineTo(120, 120); ctx.stroke(); }
        if (wrongCount >= 3) { ctx.beginPath(); ctx.moveTo(120, 85); ctx.lineTo(95, 105); ctx.stroke(); }
        if (wrongCount >= 4) { ctx.beginPath(); ctx.moveTo(120, 85); ctx.lineTo(145, 105); ctx.stroke(); }
        if (wrongCount >= 5) { ctx.beginPath(); ctx.moveTo(120, 120); ctx.lineTo(95, 155); ctx.stroke(); }
        if (wrongCount >= 6) { ctx.beginPath(); ctx.moveTo(120, 120); ctx.lineTo(145, 155); ctx.stroke(); }
      }, []);

      useEffect(() => {
        if (screen === 'SP_GAME') drawHangman(spWrong);
        if (screen === 'MP_ROOM' && roomData && roomData.status === 'PLAYING') drawHangman(roomData.wrongCount || 0);
      }, [spWrong, roomData, screen, drawHangman]);

      // Firebase 即時資料監聽
      useEffect(() => {
        if (!roomId) return;
        const roomRef = firebase.database().ref('rooms/' + roomId);
        const handleValue = (snapshot) => {
          const data = snapshot.val();
          if (data) {
            setRoomData(data);
          } else {
            if (screen === 'MP_ROOM') {
              alert('房間已被解散，將返回首頁。');
              setScreen('HOME');
              setRoomId('');
              setRoomData(null);
            }
          }
        };
        roomRef.on('value', handleValue);
        return () => roomRef.off('value', handleValue);
      }, [roomId, screen]);

      // 多人倒數計時器
      useEffect(() => {
        if (roomData?.status === 'SETTING' && roomData.settingDeadline) {
          const interval = setInterval(() => {
            const now = Date.now();
            const remain = Math.max(0, Math.ceil((roomData.settingDeadline - now) / 1000));
            setTimeLeft(remain);
            
            if (remain === 0 && playerId === roomData.ownerId) {
              const nextIdx = (roomData.setterIndex + 1) % (roomData.playerOrder?.length || 1);
              const timeLimit = roomData.settings?.timeLimit || 30;
              firebase.database().ref('rooms/' + roomId).update({
                setterIndex: nextIdx,
                settingDeadline: Date.now() + (timeLimit * 1000)
              });
            }
          }, 500);
          return () => clearInterval(interval);
        }
      }, [roomData?.status, roomData?.settingDeadline, roomData?.setterIndex, roomData?.ownerId, roomData?.playerOrder, roomData?.settings?.timeLimit, playerId, roomId]);

      // ─── 單人模式邏輯 ───
      const openCreateCol = () => {
        setEditingCol({
          id: Date.now().toString(),
          name: '新題庫合集',
          lang: 'ZH',
          words: Array.from({ length: wordCountInput }, () => ({ text: '', target: '' }))
        });
        setScreen('SP_MANAGE');
      };

      const handleSaveCol = () => {
        if (!editingCol.name.trim()) return alert('請輸入合集名稱');
        const validWords = editingCol.words
          .filter(w => w.text.trim() !== '' && w.target.trim() !== '')
          .map(w => ({ ...w, target: cleanZhuyinTarget(w.target.toUpperCase()) }));

        if (validWords.length === 0) return alert('請至少填寫一組完整的題目與解答');
        
        const newCol = { ...editingCol, words: validWords };
        setCollections(prev => {
          const exists = prev.find(c => c.id === newCol.id);
          if (exists) return prev.map(c => c.id === newCol.id ? newCol : c);
          return [...prev, newCol];
        });
        setScreen('SP_MENU');
      };

      const handleDeleteCol = (id) => {
        if (window.confirm('確定要刪除此題庫合集嗎？')) {
          setCollections(prev => prev.filter(c => c.id !== id));
        }
      };

      const startSpGame = (col) => {
        setSpCurrentCol(col);
        setSpWordIndex(0);
        setSpWordData(col.words[0]);
        setSpGuessed(new Set());
        setSpWrong(0);
        setScreen('SP_GAME');
      };

      const nextSpWord = () => {
        if (spWordIndex + 1 < spCurrentCol.words.length) {
          const nextIdx = spWordIndex + 1;
          setSpWordIndex(nextIdx);
          setSpWordData(spCurrentCol.words[nextIdx]);
          setSpGuessed(new Set());
          setSpWrong(0);
        } else {
          alert('恭喜完成此合集所有題目！');
          setScreen('SP_MENU');
        }
      };

      const handleSpGuess = (char) => {
        if (spGuessed.has(char) || spWrong >= MAX_WRONG) return;
        const newGuessed = new Set(spGuessed).add(char);
        setSpGuessed(newGuessed);
        
        if (!spWordData.target.includes(char)) {
          setSpWrong(prev => prev + 1);
        }
      };

      const renderWordSpaces = (targetStr, guessedSet, isGameOver) => {
        return targetStr.split('').map((char, idx) => {
          if (char === ' ') {
            return <div key={idx} className="w-3 sm:w-6 h-11" />;
          }
          const isGuessed = (guessedSet instanceof Set ? guessedSet.has(char) : (guessedSet || []).includes(char)) || isGameOver;
          return (
            <span key={idx} className="w-8 h-11 sm:w-10 sm:h-12 border-b-4 border-slate-700 text-xl sm:text-2xl font-bold flex items-center justify-center mb-2">
              {isGuessed ? char : ''}
            </span>
          );
        });
      };

      // ─── 多人模式邏輯 ───
      const generatePlayerId = () => 'p_' + Math.random().toString(36).substring(2, 9);

      const handleCreateRoom = () => {
        if (!roomIdInput.trim() || !playerNameInput.trim()) return alert('請輸入房間號碼與您的暱稱！');
        const pId = generatePlayerId();
        const rId = roomIdInput.trim();
        const roomRef = firebase.database().ref('rooms/' + rId);

        roomRef.get().then((snapshot) => {
          if (snapshot.exists()) {
            alert('此房間號碼已被使用，請更換一個數字或點擊「加入房間」！');
          } else {
            setPlayerId(pId);
            setPlayerName(playerNameInput.trim());
            setRoomId(rId);
            roomRef.set({
              id: rId,
              status: 'LOBBY',
              ownerId: pId,
              setterIndex: 0,
              playerOrder: [pId],
              langMode: langMode,
              wordText: '',
              wordTarget: '',
              guessed: [],
              wrongCount: 0,
              wordHistory: [],
              settings: { timeLimit: 30, winScore: 5 },
              players: {
                [pId]: { name: playerNameInput.trim(), isReady: true, score: 0 }
              }
            }).then(() => {
              setScreen('MP_ROOM');
              setShowReview(false);
            });
          }
        });
      };

      const handleJoinRoom = () => {
        if (!roomIdInput.trim() || !playerNameInput.trim()) return alert('請輸入房間號碼與您的暱稱！');
        const pId = generatePlayerId();
        const rId = roomIdInput.trim();
        const roomRef = firebase.database().ref('rooms/' + rId);

        roomRef.get().then((snapshot) => {
          if (!snapshot.exists()) {
            alert('找不到此房間！');
          } else {
            setPlayerId(pId);
            setPlayerName(playerNameInput.trim());
            setRoomId(rId);
            
            const currentOrder = snapshot.val().playerOrder || [];
            const updates = {};
            updates[`rooms/${rId}/players/${pId}`] = { name: playerNameInput.trim(), isReady: false, score: 0 };
            updates[`rooms/${rId}/playerOrder`] = [...currentOrder, pId];
            
            firebase.database().ref().update(updates).then(() => {
              setScreen('MP_ROOM');
              setShowReview(false);
            });
          }
        });
      };

      const handleDisbandRoom = () => {
        if(window.confirm('確定要解散房間嗎？這將會清除所有連線與資料，釋出此房號。')) {
          firebase.database().ref('rooms/' + roomId).remove(); 
        }
      };

      const toggleReady = () => {
        if (!roomData || !playerId) return;
        const currentReady = roomData.players?.[playerId]?.isReady || false;
        firebase.database().ref(`rooms/${roomId}/players/${playerId}`).update({ isReady: !currentReady });
      };

      // 修改房間設定 (房主專用)
      const handleUpdateSettings = (key, value) => {
        if (!roomData || roomData.ownerId !== playerId) return;
        firebase.database().ref(`rooms/${roomId}/settings/${key}`).set(Number(value));
      };

      const handleStartGame = () => {
        const timeLimit = roomData.settings?.timeLimit || 30;
        firebase.database().ref('rooms/' + roomId).update({
          status: 'SETTING',
          setterIndex: 0,
          settingDeadline: Date.now() + (timeLimit * 1000),
          wordHistory: [],
          guessed: [],
          wrongCount: 0
        });
        const scoreUpdates = {};
        roomData.playerOrder.forEach(pid => {
          scoreUpdates[`rooms/${roomId}/players/${pid}/score`] = 0;
        });
        firebase.database().ref().update(scoreUpdates);
      };

      // 多人出題提交
      const handleSubmitMpWord = () => {
        if (!mpWordText.trim() || !mpWordTarget.trim()) return alert('請完整輸入題目與解答格式！');
        
        // 進行一聲與聲調符號清理
        const sanitizedTarget = cleanZhuyinTarget(mpWordTarget.trim().toUpperCase());

        firebase.database().ref('rooms/' + roomId).update({
          wordText: mpWordText.trim(),
          wordTarget: sanitizedTarget,
          status: 'PLAYING',
          guessed: [],
          wrongCount: 0
        });
        setMpWordText('');
        setMpWordTarget('');
      };

      // 多人猜字邏輯
      const handleMpGuess = (char) => {
        if (!roomData || roomData.guessed?.includes(char) || roomData.wrongCount >= MAX_WRONG) return;
        
        const currentSetterId = roomData.playerOrder[roomData.setterIndex];
        if (playerId === currentSetterId) return; 

        const newGuessed = [...(roomData.guessed || []), char];
        const isWrong = !roomData.wordTarget.includes(char);
        const newWrongCount = isWrong ? (roomData.wrongCount + 1) : roomData.wrongCount;

        const isWordComplete = roomData.wordTarget.split('').every(c => c === ' ' || newGuessed.includes(c));
        const isHanged = newWrongCount >= MAX_WRONG;

        let updates = { guessed: newGuessed, wrongCount: newWrongCount };

        if (isWordComplete || isHanged) {
          const winnerId = isWordComplete ? playerId : currentSetterId;
          const newScore = (roomData.players[winnerId]?.score || 0) + 1;
          const winScoreTarget = roomData.settings?.winScore || 5;
          
          updates[`players/${winnerId}/score`] = newScore;
          
          const historyItem = {
            word: roomData.wordText,
            target: roomData.wordTarget,
            setter: roomData.players[currentSetterId]?.name,
            winner: roomData.players[winnerId]?.name,
            status: isWordComplete ? '被猜中' : '吊死成功'
          };
          updates.wordHistory = [...(roomData.wordHistory || []), historyItem];

          if (newScore >= winScoreTarget) {
            updates.status = 'GAME_OVER';
          } else {
            const timeLimit = roomData.settings?.timeLimit || 30;
            updates.status = 'SETTING';
            updates.setterIndex = (roomData.setterIndex + 1) % roomData.playerOrder.length;
            updates.settingDeadline = Date.now() + (timeLimit * 1000);
          }
        }
        firebase.database().ref('rooms/' + roomId).update(updates);
      };

      // 重置回大廳 (遊戲結束後使用)
      const handleBackToLobby = () => {
        firebase.database().ref('rooms/' + roomId).update({
          status: 'LOBBY',
          wordText: '',
          wordTarget: '',
          guessed: [],
          wrongCount: 0
        });
        setShowReview(false);
      };

      const keys = (screen === 'SP_GAME' ? spCurrentCol?.lang : (roomData?.langMode || langMode)) === 'ZH' ? ZHUYIN_LIST : ALPHABET_EN;
      const allPlayersReady = useMemo(() => {
        if (!roomData || !roomData.players) return false;
        return Object.values(roomData.players).every(p => p.isReady);
      }, [roomData]);

      return (
        <div className="flex flex-col items-center justify-start p-4 max-w-2xl mx-auto">
          <header className="w-full text-center py-4 border-b-2 border-dashed border-amber-300 mb-6">
            <h1 className="text-3xl font-extrabold text-amber-900 mb-2">✏️ 吊死人猜字連線對戰</h1>
            <p className="text-xs text-amber-700 font-bold tracking-widest">中英雙語・空白片語・注音聲調優化版</p>
          </header>

          {/* 1. 首頁 */}
          {screen === 'HOME' && (
            <div className="w-full bg-white p-6 rounded-2xl shadow-xl space-y-6">
              <button onClick={() => setScreen('SP_MENU')} className="w-full py-5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow-md text-xl transition">🎮 單人練習 (題庫合集)</button>
              <button onClick={() => setScreen('MP_LOGIN')} className="w-full py-5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md text-xl transition">🌐 多人線上對戰</button>
            </div>
          )}

          {/* 2. 單人題庫選單 */}
          {screen === 'SP_MENU' && (
            <div className="w-full bg-white p-6 rounded-2xl shadow-xl space-y-6">
              <div className="flex justify-between items-center mb-2">
                <h2 className="text-xl font-bold text-slate-800">選擇題庫合集</h2>
                <button onClick={() => setScreen('HOME')} className="text-sm text-slate-400 hover:text-slate-600">返回首頁</button>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {collections.map(col => (
                  <div key={col.id} className="p-4 border rounded-xl hover:border-amber-400 cursor-pointer transition relative group" onClick={() => startSpGame(col)}>
                    <div className="flex justify-between items-start mb-2">
                      <span className="font-extrabold text-lg">{col.name}</span>
                      <span className={`text-xs px-2 py-1 rounded font-bold ${col.lang === 'ZH' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'}`}>
                        {col.lang === 'ZH' ? '注音' : '英文'}
                      </span>
                    </div>
                    <p className="text-sm text-slate-500">題目數量：{col.words.length} 題</p>
                    
                    <div className="absolute top-2 right-2 hidden group-hover:flex gap-2">
                      <button onClick={(e) => { e.stopPropagation(); setEditingCol(col); setScreen('SP_MANAGE'); }} className="text-xs bg-slate-200 px-2 py-1 rounded hover:bg-slate-300">編輯</button>
                      <button onClick={(e) => { e.stopPropagation(); handleDeleteCol(col.id); }} className="text-xs bg-red-100 text-red-600 px-2 py-1 rounded hover:bg-red-200">刪除</button>
                    </div>
                  </div>
                ))}
              </div>

              <div className="border-t pt-4 flex gap-3 items-center">
                <label className="text-sm font-bold text-slate-600">自訂題目數量：</label>
                <input type="number" min="1" max="20" value={wordCountInput} onChange={e => setWordCountInput(parseInt(e.target.value)||1)} className="w-16 p-2 border rounded" />
                <button onClick={openCreateCol} className="flex-1 py-2 bg-emerald-600 text-white font-bold rounded-lg hover:bg-emerald-700 transition">+ 建立新合集</button>
              </div>
            </div>
          )}

          {/* 3. 單人題庫管理 (編輯/新增) */}
          {screen === 'SP_MANAGE' && editingCol && (
            <div className="w-full bg-white p-6 rounded-2xl shadow-xl space-y-4">
              <h2 className="text-lg font-bold text-slate-800">編輯合集內容</h2>
              
              <div className="flex gap-4">
                <input type="text" placeholder="合集名稱" value={editingCol.name} onChange={e => setEditingCol({...editingCol, name: e.target.value})} className="flex-1 p-2 border rounded font-bold" />
                <select value={editingCol.lang} onChange={e => setEditingCol({...editingCol, lang: e.target.value})} className="p-2 border rounded font-bold">
                  <option value="ZH">注音 (ZH)</option>
                  <option value="EN">英文 (EN)</option>
                </select>
              </div>

              <div className="space-y-3 max-h-80 overflow-y-auto p-1">
                {editingCol.words.map((w, idx) => (
                  <div key={idx} className="flex gap-2 items-center bg-slate-50 p-2 rounded">
                    <span className="text-xs text-slate-400 w-5">{idx + 1}.</span>
                    <input 
                      type="text" 
                      placeholder="國字/單字 (如: 柑仔店)" 
                      value={w.text} 
                      onChange={e => {
                        const newText = e.target.value;
                        const newWords = [...editingCol.words];
                        newWords[idx].text = newText;
                        if (editingCol.lang === 'ZH') {
                          newWords[idx].target = autoConvertZhuyin(newText);
                        } else {
                          newWords[idx].target = newText.toUpperCase();
                        }
                        setEditingCol({...editingCol, words: newWords});
                      }} 
                      className="flex-1 p-2 border rounded text-sm" 
                    />
                    <input 
                      type="text" 
                      placeholder="解答 (如: ㄍㄢ ㄗㄞˇ ㄉㄧㄢˋ)" 
                      value={w.target} 
                      onChange={e => {
                        const newWords = [...editingCol.words];
                        newWords[idx].target = e.target.value;
                        setEditingCol({...editingCol, words: newWords});
                      }} 
                      className="flex-1 p-2 border rounded text-sm font-mono" 
                    />
                  </div>
                ))}
              </div>

              <div className="flex gap-3 pt-2">
                <button onClick={() => setScreen('SP_MENU')} className="flex-1 py-2 bg-slate-200 text-slate-700 font-bold rounded-lg">取消</button>
                <button onClick={handleSaveCol} className="flex-1 py-2 bg-amber-500 text-white font-bold rounded-lg">儲存合集</button>
              </div>
            </div>
          )}

          {/* 4. 單人遊戲畫面 */}
          {screen === 'SP_GAME' && spWordData && (
            <div className="w-full bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center space-y-4">
              <div className="w-full flex justify-between items-center text-sm font-bold text-slate-500">
                <span>合集：{spCurrentCol.name} ({spWordIndex + 1}/{spCurrentCol.words.length})</span>
                <button onClick={() => setScreen('SP_MENU')} className="text-slate-400 hover:text-slate-600">退出</button>
              </div>

              <canvas ref={canvasRef} width="200" height="200" className="bg-amber-50 rounded-xl border" />

              <div className="text-center font-extrabold text-2xl text-amber-800 tracking-widest my-2">
                {spWordData.text}
              </div>

              <div className="flex flex-wrap justify-center gap-1 sm:gap-2 my-2">
                {renderWordSpaces(spWordData.target, spGuessed, spWrong >= MAX_WRONG)}
              </div>

              {/* 注音/英文 鍵盤 */}
              <div className="flex flex-wrap justify-center gap-1.5 max-w-lg mt-4">
                {keys.map(k => {
                  const isUsed = spGuessed.has(k);
                  return (
                    <button
                      key={k}
                      disabled={isUsed || spWrong >= MAX_WRONG}
                      onClick={() => handleSpGuess(k)}
                      className={`w-9 h-11 sm:w-10 sm:h-12 rounded-lg font-bold text-lg shadow-sm transition ${
                        isUsed ? 'bg-slate-200 text-slate-400 border' : 'bg-amber-100 hover:bg-amber-200 text-amber-900'
                      }`}
                    >
                      {k}
                    </button>
                  );
                })}
              </div>

              {/* 遊戲結果與下一題 */}
              {(spWordData.target.split('').every(c => c === ' ' || spGuessed.has(c)) || spWrong >= MAX_WRONG) && (
                <div className="mt-4 p-4 bg-amber-50 border-2 border-amber-300 rounded-xl text-center w-full">
                  <p className="font-extrabold text-lg mb-2">
                    {spWrong >= MAX_WRONG ? '❌ 挑戰失敗！吊死人完成！' : '🎉 恭喜答對！天資聰穎！'}
                  </p>
                  <p className="text-sm text-slate-600 mb-3">正確解答：{spWordData.target}</p>
                  <button onClick={nextSpWord} className="px-6 py-2 bg-amber-500 text-white font-bold rounded-lg shadow hover:bg-amber-600 transition">
                    下一題 ➔
                  </button>
                </div>
              )}
            </div>
          )}

          {/* 5. 多人對戰登入畫面 */}
          {screen === 'MP_LOGIN' && (
            <div className="w-full bg-white p-6 rounded-2xl shadow-xl space-y-4">
              <div className="flex justify-between items-center mb-2">
                <h2 className="text-xl font-bold text-slate-800">🌐 多人對戰連線</h2>
                <button onClick={() => setScreen('HOME')} className="text-sm text-slate-400">回首頁</button>
              </div>

              <div className="space-y-3">
                <label className="block text-sm font-bold text-slate-700">玩家暱稱：</label>
                <input type="text" placeholder="請輸入暱稱" value={playerNameInput} onChange={e => setPlayerNameInput(e.target.value)} className="w-full p-3 border rounded-xl font-bold" />

                <label className="block text-sm font-bold text-slate-700">房間號碼：</label>
                <input type="text" placeholder="例如: 888" value={roomIdInput} onChange={e => setRoomIdInput(e.target.value)} className="w-full p-3 border rounded-xl font-bold" />

                <label className="block text-sm font-bold text-slate-700">語言模式：</label>
                <div className="flex gap-4">
                  <button onClick={() => setLangMode('ZH')} className={`flex-1 py-2 rounded-lg font-bold border ${langMode === 'ZH' ? 'bg-amber-500 text-white border-amber-500' : 'bg-slate-50'}`}>注音 (ZH)</button>
                  <button onClick={() => setLangMode('EN')} className={`flex-1 py-2 rounded-lg font-bold border ${langMode === 'EN' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50'}`}>英文 (EN)</button>
                </div>
              </div>

              <div className="flex gap-3 pt-4">
                <button onClick={handleCreateRoom} className="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow hover:bg-indigo-700 transition">創建房間</button>
                <button onClick={handleJoinRoom} className="flex-1 py-3 bg-emerald-600 text-white font-bold rounded-xl shadow hover:bg-emerald-700 transition">加入房間</button>
              </div>
            </div>
          )}

          {/* 6. 多人房間與對戰主畫面 */}
          {screen === 'MP_ROOM' && roomData && (
            <div className="w-full bg-white p-6 rounded-2xl shadow-xl space-y-6">
              <div className="flex justify-between items-center border-b pb-3">
                <div>
                  <h2 className="text-xl font-extrabold text-slate-800">房間號碼：{roomId}</h2>
                  <span className="text-xs bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded">
                    {roomData.langMode === 'ZH' ? '注音拼音' : '英文 Alphabet'}
                  </span>
                </div>
                <button onClick={handleDisbandRoom} className="text-xs bg-red-100 text-red-600 px-3 py-1.5 rounded-lg font-bold hover:bg-red-200">解散/離開</button>
              </div>

              {/* A. 房間大廳狀態 (LOBBY) */}
              {roomData.status === 'LOBBY' && (
                <div className="space-y-4">
                  {/* 設定選項區塊 (房主可調整) */}
                  <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 space-y-3">
                    <h3 className="font-bold text-amber-900 text-sm flex items-center gap-1">⚙️ 房間規則設定 {playerId !== roomData.ownerId && '(房主可調整)'}</h3>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">出題時間限制：</label>
                        <select 
                          disabled={playerId !== roomData.ownerId}
                          value={roomData.settings?.timeLimit || 30} 
                          onChange={e => handleUpdateSettings('timeLimit', e.target.value)}
                          className="w-full p-2 border rounded-lg bg-white font-bold text-sm"
                        >
                          <option value={15}>15 秒</option>
                          <option value={30}>30 秒</option>
                          <option value={45}>45 秒</option>
                          <option value={60}>60 秒</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">獲勝分數目標：</label>
                        <select 
                          disabled={playerId !== roomData.ownerId}
                          value={roomData.settings?.winScore || 5} 
                          onChange={e => handleUpdateSettings('winScore', e.target.value)}
                          className="w-full p-2 border rounded-lg bg-white font-bold text-sm"
                        >
                          <option value={3}>3 分</option>
                          <option value={5}>5 分</option>
                          <option value={10}>10 分</option>
                          <option value={15}>15 分</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <div className="space-y-2">
                    <h3 className="font-bold text-slate-700 text-sm">玩家列表：</h3>
                    {roomData.playerOrder.map(pid => {
                      const p = roomData.players[pid];
                      const isOwner = pid === roomData.ownerId;
                      return (
                        <div key={pid} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border">
                          <span className="font-bold">{p.name} {isOwner && '👑 (房主)'}</span>
                          <span className={`text-xs px-2 py-1 rounded font-bold ${p.isReady ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-500'}`}>
                            {p.isReady ? '已準備' : '未準備'}
                          </span>
                        </div>
                      );
                    })}
                  </div>

                  <div className="pt-2 flex gap-3">
                    <button onClick={toggleReady} className="flex-1 py-3 bg-slate-200 font-bold rounded-xl text-slate-700 hover:bg-slate-300">
                      {roomData.players?.[playerId]?.isReady ? '取消準備' : '點擊準備'}
                    </button>
                    {playerId === roomData.ownerId && (
                      <button disabled={!allPlayersReady} onClick={handleStartGame} className={`flex-1 py-3 font-bold rounded-xl text-white ${allPlayersReady ? 'bg-emerald-600 hover:bg-emerald-700 shadow' : 'bg-slate-300'}`}>
                        開始遊戲
                      </button>
                    )}
                  </div>
                </div>
              )}

              {/* B. 出題階段 (SETTING) */}
              {roomData.status === 'SETTING' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center bg-amber-100 p-3 rounded-xl">
                    <span className="font-bold text-amber-900">
                      輪到 【{roomData.players[roomData.playerOrder[roomData.setterIndex]]?.name}】 出題
                    </span>
                    <span className="font-extrabold text-red-600">⏳ 剩餘 {timeLeft} 秒</span>
                  </div>

                  {playerId === roomData.playerOrder[roomData.setterIndex] ? (
                    <div className="bg-slate-50 p-4 rounded-xl border space-y-3">
                      <h3 className="font-bold text-slate-800">請輸入您要出題的內容：</h3>
                      <input 
                        type="text" 
                        placeholder="請輸入國字/單字 (例如: 柑仔店)" 
                        value={mpWordText} 
                        onChange={e => {
                          const val = e.target.value;
                          setMpWordText(val);
                          if (roomData.langMode === 'ZH') {
                            setMpWordTarget(autoConvertZhuyin(val));
                          } else {
                            setMpWordTarget(val.toUpperCase());
                          }
                        }}
                        className="w-full p-2 border rounded-lg font-bold" 
                      />
                      <input 
                        type="text" 
                        placeholder="解答格式 (例如: ㄍㄢ ㄗㄞˇ ㄉㄧㄢˋ)" 
                        value={mpWordTarget} 
                        onChange={e => setMpWordTarget(e.target.value)} 
                        className="w-full p-2 border rounded-lg font-mono text-sm" 
                      />
                      <p className="text-xs text-slate-500">*系統已自動將一聲符號過濾清洗，確保無點擊衝突。</p>
                      <button onClick={handleSubmitMpWord} className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow hover:bg-indigo-700 transition">
                        出題並開始計分
                      </button>
                    </div>
                  ) : (
                    <div className="text-center py-8 bg-slate-50 rounded-xl border">
                      <p className="font-bold text-slate-600">正在等待出題者思考題目，請做好準備...</p>
                    </div>
                  )}
                </div>
              )}

              {/* C. 進行猜字對戰 (PLAYING) */}
              {roomData.status === 'PLAYING' && (
                <div className="flex flex-col items-center space-y-4">
                  {/* 計分板 */}
                  <div className="w-full grid grid-cols-2 sm:grid-cols-4 gap-2 text-center bg-slate-50 p-3 rounded-xl border">
                    {roomData.playerOrder.map(pid => (
                      <div key={pid} className={`p-1.5 rounded-lg ${pid === roomData.playerOrder[roomData.setterIndex] ? 'bg-amber-100 border border-amber-300' : ''}`}>
                        <div className="text-xs text-slate-500 font-bold">{roomData.players[pid]?.name}</div>
                        <div className="text-lg font-extrabold text-amber-800">{roomData.players[pid]?.score || 0} 分</div>
                      </div>
                    ))}
                  </div>

                  <canvas ref={canvasRef} width="180" height="180" className="bg-amber-50 rounded-xl border" />

                  <div className="text-center font-extrabold text-2xl text-amber-800 tracking-widest">
                    {roomData.wordText}
                  </div>

                  <div className="flex flex-wrap justify-center gap-1 sm:gap-2 my-1">
                    {renderWordSpaces(roomData.wordTarget, roomData.guessed || [], roomData.wrongCount >= MAX_WRONG)}
                  </div>

                  {/* 鍵盤 */}
                  <div className="flex flex-wrap justify-center gap-1.5 max-w-lg mt-2">
                    {keys.map(k => {
                      const isGuessed = roomData.guessed?.includes(k);
                      const isSetter = playerId === roomData.playerOrder[roomData.setterIndex];
                      return (
                        <button
                          key={k}
                          disabled={isGuessed || isSetter || roomData.wrongCount >= MAX_WRONG}
                          onClick={() => handleMpGuess(k)}
                          className={`w-9 h-11 sm:w-10 sm:h-12 rounded-lg font-bold text-lg shadow-sm transition ${
                            isGuessed ? 'bg-slate-200 text-slate-400 border' : 'bg-amber-100 hover:bg-amber-200 text-amber-900'
                          }`}
                        >
                          {k}
                        </button>
                      );
                    })}
                  </div>
                  {playerId === roomData.playerOrder[roomData.setterIndex] && (
                    <p className="text-xs text-amber-700 font-bold">👀 您是本局出題者，正在觀戰其他玩家猜字中...</p>
                  )}
                </div>
              )}

              {/* D. 遊戲結束畫面 (GAME_OVER) */}
              {roomData.status === 'GAME_OVER' && (
                <div className="text-center bg-amber-50 p-6 rounded-2xl border-2 border-amber-300 space-y-4">
                  <h2 className="text-2xl font-extrabold text-amber-900">🎉 遊戲結束！最終優勝誕生！</h2>
                  
                  {/* 結算排行榜 */}
                  <div className="bg-white p-4 rounded-xl border max-w-md mx-auto space-y-2">
                    <h3 className="font-bold text-slate-700 text-sm mb-2 border-b pb-1">🏆 最終積分結算榜</h3>
                    {roomData.playerOrder
                      .map(pid => roomData.players[pid])
                      .sort((a, b) => (b.score || 0) - (a.score || 0))
                      .map((p, idx) => (
                        <div key={idx} className="flex justify-between items-center py-1 border-b last:border-none">
                          <span className="font-bold">{idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉'} {p.name}</span>
                          <span className="font-extrabold text-amber-700">{p.score || 0} 分</span>
                        </div>
                      ))}
                  </div>

                  {/* 歷史紀錄與回顧按鈕 */}
                  <div className="flex flex-col sm:flex-row gap-3 pt-2 justify-center">
                    <button 
                      onClick={() => setShowReview(!showReview)} 
                      className="px-5 py-2.5 bg-indigo-600 text-white font-bold rounded-xl shadow hover:bg-indigo-700 transition"
                    >
                      📜 {showReview ? '隱藏歷史題目' : '查看歷史題目回顧'}
                    </button>
                    <button 
                      onClick={handleBackToLobby} 
                      className="px-5 py-2.5 bg-emerald-600 text-white font-bold rounded-xl shadow hover:bg-emerald-700 transition"
                    >
                      🔄 回到房間 (準備下一局)
                    </button>
                  </div>

                  {/* 展開歷史題目列表 */}
                  {showReview && (
                    <div className="bg-white p-4 rounded-xl border text-left space-y-2 max-h-60 overflow-y-auto">
                      <h4 className="font-bold text-slate-800 text-sm border-b pb-1">📜 本局歷史出題紀錄：</h4>
                      {roomData.wordHistory && roomData.wordHistory.length > 0 ? (
                        roomData.wordHistory.map((h, i) => (
                          <div key={i} className="text-xs bg-slate-50 p-2 rounded border space-y-0.5">
                            <div className="font-bold text-slate-700">第 {i + 1} 題: {h.word} ({h.target})</div>
                            <div className="text-slate-500">出題者: {h.setter} | 得分者: {h.winner} ({h.status})</div>
                          </div>
                        ))
                      ) : (
                        <p className="text-xs text-slate-400">尚無出題紀錄</p>
                      )}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<HangmanGame />);
  </script>
</body>
</html>
