<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>吊死人猜字連線對戰 - 旗艦版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyB9QjUN5oTSEkOVd5p-6rJfZEoAFc-ns38",
      authDomain: "hangman-ce85a.firebaseapp.com",
      databaseURL: "https://hangman-ce85a-default-rtdb.firebaseio.com",
      projectId: "hangman-ce85a",
      storageBucket: "hangman-ce85a.firebasestorage.app",
      messagingSenderId: "473298738214",
      appId: "1:473298738214:web:f57f31f19dce05ee579ae7"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const ALPHABET_EN = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    // 加入了一聲符號「ˉ」，讓一聲不會有邏輯衝突並可被明確點擊猜測
    const ZHUYIN_LIST = ['ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ','ㄍ','ㄎ','ㄏ','ㄐ','ㄑ','ㄒ','ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ','ㄧ','ㄨ','ㄩ','ㄚ','ㄛ','ㄜ','ㄝ','ㄞ','ㄟ','ㄠ','ㄡ','ㄢ','ㄣ','ㄤ','ㄥ','ㄦ','ˉ','ˊ','ˇ','ˋ','˙'];
    const MAX_WRONG = 6;

    // 簡易內建國字轉注音字典 (一聲字明確加上「ˉ」)
    const ZHUYIN_DICT = {
      '柑': 'ㄍㄢˉ', '仔': 'ㄗㄞˇ', '店': 'ㄉㄧㄢˋ', '推': 'ㄊㄨㄟˉ', '冰': 'ㄅㄧㄥˉ', '壺': 'ㄏㄨˊ',
      '珍': 'ㄓㄣˉ', '珠': 'ㄓㄨˉ', '奶': 'ㄋㄞˇ', '茶': 'ㄔㄚˊ', '貓': 'ㄇㄠˉ', '狗': 'ㄍㄡˇ',
      '翻': 'ㄈㄢˉ', '樂': 'ㄌㄜˋ', '蘋': 'ㄆㄧㄥˊ', '果': 'ㄍㄨㄛˇ', '紅': 'ㄏㄨㄥˊ'
    };

    function autoConvertZhuyin(text) {
      return text.split('').map(c => ZHUYIN_DICT[c] || c).join(' ');
    }

    // 初始預設題庫 (一聲字明確加上「ˉ」)
    const DEFAULT_COLLECTIONS = [
      {
        id: 'c1', name: '懷舊與日常', lang: 'ZH',
        words: [
          { text: '柑仔店', target: 'ㄍㄢˉ ㄗㄞˇ ㄉㄧㄢˋ' },
          { text: '推冰壺', target: 'ㄊㄨㄟˉ ㄅㄧㄥˉ ㄏㄨˊ' },
          { text: '珍珠奶茶', target: 'ㄓㄣˉ ㄓㄨˉ ㄋㄞˇ ㄔㄚˊ' },
          { text: '小貓', target: 'ㄒㄧㄠˇ ㄇㄠˉ' }
        ]
      },
      {
        id: 'c2', name: 'Daily Phrases', lang: 'EN',
        words: [
          { text: 'APPLE PIE', target: 'APPLE PIE' },
          { text: 'ICE CREAM', target: 'ICE CREAM' },
          { text: 'GOOD MORNING', target: 'GOOD MORNING' }
        ]
      }
    ];

    function HangmanGame() {
      const [screen, setScreen] = useState('HOME');
      
      // ─── 單人模式 ───
      const [collections, setCollections] = useState(() => {
        const saved = localStorage.getItem('hangman_collections_v3');
        return saved ? JSON.parse(saved) : DEFAULT_COLLECTIONS;
      });
      const [spCurrentCol, setSpCurrentCol] = useState(null);
      const [spWordIndex, setSpWordIndex] = useState(0);
      const [spWordData, setSpWordData] = useState(null);
      const [spGuessed, setSpGuessed] = useState(new Set());
      const [spWrong, setSpWrong] = useState(0);

      const [editingCol, setEditingCol] = useState(null);
      const [wordCountInput, setWordCountInput] = useState(3);

      // ─── 多人模式 ───
      const [roomIdInput, setRoomIdInput] = useState('');
      const [playerNameInput, setPlayerNameInput] = useState('');
      const [roomId, setRoomId] = useState('');
      const [playerId, setPlayerId] = useState('');
      const [playerName, setPlayerName] = useState('');
      const [roomData, setRoomData] = useState(null);
      const [langMode, setLangMode] = useState('ZH'); 
      
      const [mpWordText, setMpWordText] = useState(''); 
      const [mpWordTarget, setMpWordTarget] = useState(''); 
      
      const [timeLeft, setTimeLeft] = useState(0);
      const [showReview, setShowReview] = useState(false);

      const canvasRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('hangman_collections_v3', JSON.stringify(collections));
      }, [collections]);

      const drawHangman = useCallback((wrongCount) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#374151'; ctx.lineWidth = 4; ctx.lineCap = 'round';

        ctx.beginPath();
        ctx.moveTo(20, 180); ctx.lineTo(100, 180);
        ctx.moveTo(40, 180); ctx.lineTo(40, 20);
        ctx.lineTo(120, 20); ctx.lineTo(120, 40);
        ctx.stroke();

        if (wrongCount >= 1) { ctx.beginPath(); ctx.arc(120, 55, 15, 0, Math.PI * 2); ctx.stroke(); }
        if (wrongCount >= 2) { ctx.beginPath(); ctx.moveTo(120, 70); ctx.lineTo(120, 120); ctx.stroke(); }
        if (wrongCount >= 3) { ctx.beginPath(); ctx.moveTo(120, 85); ctx.lineTo(95, 105); ctx.stroke(); }
        if (wrongCount >= 4) { ctx.beginPath(); ctx.moveTo(120, 85); ctx.lineTo(145, 105); ctx.stroke(); }
        if (wrongCount >= 5) { ctx.beginPath(); ctx.moveTo(120, 120); ctx.lineTo(95, 155); ctx.stroke(); }
        if (wrongCount >= 6) { ctx.beginPath(); ctx.moveTo(120, 120); ctx.lineTo(145, 155); ctx.stroke(); }
      }, []);

      useEffect(() => {
        if (screen === 'SP_GAME') drawHangman(spWrong);
        if (screen === 'MP_ROOM' && roomData && (roomData.status === 'PLAYING' || roomData.status === 'GAME_OVER')) drawHangman(roomData.wrongCount || 0);
      }, [spWrong, roomData?.wrongCount, roomData?.status, screen, drawHangman]);

      useEffect(() => {
        if (!roomId) return;
        const roomRef = firebase.database().ref('rooms/' + roomId);
        const handleValue = (snapshot) => {
          const data = snapshot.val();
          if (data) {
            setRoomData(data);
          } else {
            if (screen === 'MP_ROOM') {
              alert('房間已被解散，將返回首頁。');
              setScreen('HOME');
              setRoomId('');
              setRoomData(null);
            }
          }
        };
        roomRef.on('value', handleValue);
        return () => roomRef.off('value', handleValue);
      }, [roomId, screen]);

      // 多人模式：倒數計時器
      useEffect(() => {
        if (roomData?.status === 'SETTING' && roomData.settingDeadline) {
          const interval = setInterval(() => {
            const now = Date.now();
            const remain = Math.max(0, Math.ceil((roomData.settingDeadline - now) / 1000));
            setTimeLeft(remain);
            
            if (remain === 0 && playerId === roomData.ownerId) {
              const nextIdx = (roomData.setterIndex + 1) % (roomData.playerOrder?.length || 1);
              firebase.database().ref('rooms/' + roomId).update({
                setterIndex: nextIdx,
                settingDeadline: Date.now() + (roomData.settings.timeLimit * 1000)
              });
            }
          }, 500);
          return () => clearInterval(interval);
        }
      }, [roomData?.status, roomData?.settingDeadline, roomData?.setterIndex, roomData?.ownerId, roomData?.playerOrder, playerId, roomId]);

      // ─── 單人題庫管理邏輯 ───
      const openCreateCol = () => {
        setEditingCol({
          id: Date.now().toString(),
          name: '新題庫合集',
          lang: 'ZH',
          words: Array.from({ length: wordCountInput }, () => ({ text: '', target: '' }))
        });
        setScreen('SP_MANAGE');
      };

      const handleSaveCol = () => {
        if (!editingCol.name.trim()) return alert('請輸入合集名稱');
        const validWords = editingCol.words.filter(w => w.text.trim() !== '' && w.target.trim() !== '');
        if (validWords.length === 0) return alert('請至少填寫一組完整的題目與解答');
        
        const newCol = { ...editingCol, words: validWords };
        setCollections(prev => {
          const exists = prev.find(c => c.id === newCol.id);
          if (exists) return prev.map(c => c.id === newCol.id ? newCol : c);
          return [...prev, newCol];
        });
        setScreen('SP_MENU');
      };

      const handleDeleteCol = (id) => {
        if (window.confirm('確定要刪除此題庫合集嗎？')) {
          setCollections(prev => prev.filter(c => c.id !== id));
        }
      };

      const startSpGame = (col) => {
        setSpCurrentCol(col);
        setSpWordIndex(0);
        setSpWordData(col.words[0]);
        setSpGuessed(new Set());
        setSpWrong(0);
        setScreen('SP_GAME');
      };

      const nextSpWord = () => {
        if (spWordIndex + 1 < spCurrentCol.words.length) {
          const nextIdx = spWordIndex + 1;
          setSpWordIndex(nextIdx);
          setSpWordData(spCurrentCol.words[nextIdx]);
          setSpGuessed(new Set());
          setSpWrong(0);
        } else {
          alert('恭喜完成此合集所有題目！');
          setScreen('SP_MENU');
        }
      };

      const handleSpGuess = (char) => {
        if (spGuessed.has(char) || spWrong >= MAX_WRONG) return;
        const newGuessed = new Set(spGuessed).add(char);
        setSpGuessed(newGuessed);
        
        if (!spWordData.target.includes(char)) {
          setSpWrong(prev => prev + 1);
        }
      };

      const renderWordSpaces = (targetStr, guessedSet, isGameOver) => {
        return targetStr.split('').map((char, idx) => {
          if (char === ' ') return <div key={idx} className="w-3 sm:w-6 h-11" />;
          const isGuessed = guessedSet.has(char) || isGameOver;
          return (
            <span key={idx} className="w-8 h-11 sm:w-10 sm:h-12 border-b-4 border-slate-700 text-xl sm:text-2xl font-bold flex items-center justify-center mb-2">
              {isGuessed ? char : ''}
            </span>
          );
        });
      };

      // ─── 多人遊戲邏輯 ───
      const generatePlayerId = () => 'p_' + Math.random().toString(36).substring(2, 9);

      const handleCreateRoom = () => {
        if (!roomIdInput.trim() || !playerNameInput.trim()) return alert('請輸入房間號碼與您的暱稱！');
        const pId = generatePlayerId();
        const rId = roomIdInput.trim();
        const roomRef = firebase.database().ref('rooms/' + rId);

        roomRef.get().then((snapshot) => {
          if (snapshot.exists()) {
            alert('此房間號碼已被使用，請更換一個數字或點擊「加入房間」！');
          } else {
            setPlayerId(pId);
            setPlayerName(playerNameInput.trim());
            setRoomId(rId);
            roomRef.set({
              id: rId,
              status: 'LOBBY',
              ownerId: pId,
              setterIndex: 0,
              playerOrder: [pId],
              langMode: langMode,
              wordText: '',
              wordTarget: '',
              guessed: [],
              wrongCount: 0,
              wordHistory: [],
              settings: { timeLimit: 30, winScore: 5 },
              players: {
                [pId]: { name: playerNameInput.trim(), isReady: true, score: 0 }
              }
            }).then(() => {
              setScreen('MP_ROOM');
              setShowReview(false);
            });
          }
        });
      };

      const handleJoinRoom = () => {
        if (!roomIdInput.trim() || !playerNameInput.trim()) return alert('請輸入房間號碼與您的暱稱！');
        const pId = generatePlayerId();
        const rId = roomIdInput.trim();
        const roomRef = firebase.database().ref('rooms/' + rId);

        roomRef.get().then((snapshot) => {
          if (!snapshot.exists()) {
            alert('找不到此房間！');
          } else {
            setPlayerId(pId);
            setPlayerName(playerNameInput.trim());
            setRoomId(rId);
            
            const currentOrder = snapshot.val().playerOrder || [];
            const updates = {};
            updates[`rooms/${rId}/players/${pId}`] = { name: playerNameInput.trim(), isReady: false, score: 0 };
            updates[`rooms/${rId}/playerOrder`] = [...currentOrder, pId];
            
            firebase.database().ref().update(updates).then(() => {
              setScreen('MP_ROOM');
              setShowReview(false);
            });
          }
        });
      };

      const handleDisbandRoom = () => {
        if(window.confirm('確定要解散房間嗎？這將會清除所有連線與資料，釋出此房號。')) {
          firebase.database().ref('rooms/' + roomId).remove(); 
        }
      };

      const toggleReady = () => {
        if (!roomData || !playerId) return;
        const currentReady = roomData.players?.[playerId]?.isReady || false;
        firebase.database().ref(`rooms/${roomId}/players/${playerId}`).update({ isReady: !currentReady });
      };

      const handleStartGame = () => {
        firebase.database().ref('rooms/' + roomId).update({
          status: 'SETTING',
          setterIndex: 0,
          settingDeadline: Date.now() + (roomData.settings.timeLimit * 1000),
          wordHistory: [],
          guessed: [],
          wrongCount: 0
        });
        const scoreUpdates = {};
        roomData.playerOrder.forEach(pid => {
          scoreUpdates[`rooms/${roomId}/players/${pid}/score`] = 0;
        });
        firebase.database().ref().update(scoreUpdates);
      };

      const handleSubmitMpWord = () => {
        if (!mpWordText.trim() || !mpWordTarget.trim()) return alert('請完整輸入題目與解答格式！');
        firebase.database().ref('rooms/' + roomId).update({
          wordText: mpWordText.trim(),
          wordTarget: mpWordTarget.trim().toUpperCase(),
          status: 'PLAYING',
          guessed: [],
          wrongCount: 0
        });
        setMpWordText('');
        setMpWordTarget('');
      };

      const handleMpGuess = (char) => {
        if (!roomData || roomData.guessed?.includes(char) || roomData.wrongCount >= MAX_WRONG) return;
        
        const currentSetterId = roomData.playerOrder[roomData.setterIndex];
        if (playerId === currentSetterId) return; 

        const newGuessed = [...(roomData.guessed || []), char];
        const isWrong = !roomData.wordTarget.includes(char);
        const newWrongCount = isWrong ? (roomData.wrongCount + 1) : roomData.wrongCount;

        const isWordComplete = roomData.wordTarget.split('').every(c => c === ' ' || newGuessed.includes(c));
        const isHanged = newWrongCount >= MAX_WRONG;

        let updates = { guessed: newGuessed, wrongCount: newWrongCount };

        if (isWordComplete || isHanged) {
          const winnerId = isWordComplete ? playerId : currentSetterId;
          const newScore = (roomData.players[winnerId]?.score || 0) + 1;
          
          updates[`players/${winnerId}/score`] = newScore;
          
          const historyItem = {
            word: roomData.wordText,
            target: roomData.wordTarget,
            setter: roomData.players[currentSetterId]?.name,
            winner: roomData.players[winnerId]?.name,
            status: isWordComplete ? '被猜中' : '吊死成功'
          };
          updates.wordHistory = [...(roomData.wordHistory || []), historyItem];

          if (newScore >= roomData.settings.winScore) {
            updates.status = 'GAME_OVER';
          } else {
            updates.status = 'SETTING';
            updates.setterIndex = (roomData.setterIndex + 1) % roomData.playerOrder.length;
            updates.settingDeadline = Date.now() + (roomData.settings.timeLimit * 1000);
          }
        }
        firebase.database().ref('rooms/' + roomId).update(updates);
      };

      const keys = (screen === 'SP_GAME' ? spCurrentCol.lang : (roomData?.langMode || langMode)) === 'ZH' ? ZHUYIN_LIST : ALPHABET_EN;
      const allPlayersReady = useMemo(() => {
        if (!roomData || !roomData.players) return false;
        return Object.values(roomData.players).every(p => p.isReady);
      }, [roomData]);

      return (
        <div className="flex flex-col items-center justify-start p-4 max-w-2xl mx-auto pb-20">
          <header className="w-full text-center py-4 border-b-2 border-dashed border-amber-300 mb-6">
            <h1 className="text-3xl font-extrabold text-amber-900 mb-2">✏️ 吊死人猜字連線對戰</h1>
            <p className="text-xs text-amber-700 font-bold tracking-widest">中英雙語・空白片語・注音聲調版</p>
          </header>

          {/* 1. 首頁 */}
          {screen === 'HOME' && (
            <div className="w-full bg-white p-6 rounded-2xl shadow-xl space-y-6">
              <button onClick={() => setScreen('SP_MENU')} className="w-full py-5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow-md text-xl transition">🎮 單人練習 (題庫合集)</button>
              <button onClick={() => setScreen('MP_LOGIN')} className="w-full py-5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md text-xl transition">🌐 多人線上對戰</button>
            </div>
          )}

          {/* 2. 單人題庫選單 */}
          {screen === 'SP_MENU' && (
            <div className="w-full bg-white p-6 rounded-2xl shadow-xl space-y-6">
              <div className="flex justify-between items-center mb-2">
                <h2 className="text-xl font-bold text-slate-800">選擇題庫合集</h2>
                <button onClick={() => setScreen('HOME')} className="text-sm text-slate-400 hover:text-slate-600">返回首頁</button>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {collections.map(col => (
                  <div key={col.id} className="p-4 border rounded-xl hover:border-amber-400 cursor-pointer transition relative group" onClick={() => startSpGame(col)}>
                    <div className="flex justify-between items-start mb-2">
                      <span className="font-extrabold text-lg">{col.name}</span>
                      <span className={`text-xs px-2 py-1 rounded font-bold ${col.lang === 'ZH' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'}`}>
                        {col.lang === 'ZH' ? '注音' : '英文'}
                      </span>
                    </div>
                    <p className="text-sm text-slate-500">題目數量：{col.words.length} 題</p>
                    
                    <div className="absolute top-2 right-2 hidden group-hover:flex gap-2">
                      <button onClick={(e) => { e.stopPropagation(); setEditingCol(col); setScreen('SP_MANAGE'); }} className="text-xs bg-slate-200 px-2 py-1 rounded hover:bg-slate-300">編輯</button>
                      <button onClick={(e) => { e.stopPropagation(); handleDeleteCol(col.id); }} className="text-xs bg-red-100 text-red-600 px-2 py-1 rounded hover:bg-red-200">刪除</button>
                    </div>
                  </div>
                ))}
              </div>

              <div className="border-t pt-4 flex gap-3 items-center">
                <label className="text-sm font-bold text-slate-600">自訂題目數量：</label>
                <input type="number" min="1" max="20" value={wordCountInput} onChange={e => setWordCountInput(parseInt(e.target.value)||1)} className="w-16 p-2 border rounded" />
                <button onClick={openCreateCol} className="flex-1 py-2 bg-emerald-600 text-white font-bold rounded-lg hover:bg-emerald-700 transition">+ 建立新合集</button>
              </div>
            </div>
          )}

          {/* 3. 單人題庫管理 (編輯/新增) */}
          {screen === 'SP_MANAGE' && editingCol && (
            <div className="w-full bg-white p-6 rounded-2xl shadow-xl space-y-4">
              <h2 className="text-lg font-bold text-slate-800">{editingCol.id.length > 10 ? '新增合集' : '編輯合集'}</h2>
              
              <div className="flex gap-4">
                <input type="text" placeholder="合集名稱" value={editingCol.name} onChange={e => setEditingCol({...editingCol, name: e.target.value})} className="flex-1 p-2 border rounded" />
                <select value={editingCol.lang} onChange={e => setEditingCol({...editingCol, lang: e.target.value})} className="w-24 p-2 border rounded">
                  <option value="ZH">注音</option>
                  <option value="EN">英文</option>
                </select>
              </div>

              <div className="space-y-2 max-h-96 overflow-y-auto pr-2">
                {editingCol.words.map((w, i) => (
                  <div key={i} className="flex gap-2 items-center bg-slate-50 p-2 rounded">
                    <span className="font-bold text-slate-400 text-sm w-4">{i+1}.</span>
                    <input placeholder="原字(遊戲中隱藏)" value={w.text} onChange={e => {
                       const newW = [...editingCol.words];
                       newW[i].text = e.target.value;
                       if (editingCol.lang === 'ZH') newW[i].target = autoConvertZhuyin(e.target.value);
                       setEditingCol({...editingCol, words: newW});
                    }} className="w-1/3 p-2 border rounded text-sm" />
                    <input placeholder="目標字串 (以空白分隔)" value={w.target} onChange={e => {
                       const newW = [...editingCol.words];
                       newW[i].target = e.target.value.toUpperCase();
                       setEditingCol({...editingCol, words: newW});
                    }} className="flex-1 p-2 border rounded text-sm font-bold" />
                  </div>
                ))}
              </div>
              <div className="flex gap-4 pt-4 border-t">
                 <button onClick={() => setScreen('SP_MENU')} className="flex-1 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition">取消</button>
                 <button onClick={handleSaveCol} className="flex-1 py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl transition">儲存</button>
              </div>
            </div>
          )}

          {/* 4. 單人遊戲畫面 */}
          {screen === 'SP_GAME' && spWordData && (
            <div className="w-full bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center">
              <div className="w-full flex justify-between items-center mb-4 border-b pb-2">
                <span className="font-bold text-amber-600">單人練習 - {spCurrentCol.name} ({spWordIndex + 1}/{spCurrentCol.words.length})</span>
                <button onClick={() => setScreen('SP_MENU')} className="text-sm bg-slate-200 px-3 py-1 rounded hover:bg-slate-300">放棄離開</button>
              </div>

              <canvas ref={canvasRef} width="160" height="200" className="bg-amber-50 rounded-xl mb-6 shadow-sm border border-amber-100"></canvas>

              <div className="flex flex-wrap justify-center gap-2 mb-8">
                {renderWordSpaces(spWordData.target, spGuessed, spWrong >= MAX_WRONG || spWordData.target.split('').every(c => c === ' ' || spGuessed.has(c)))}
              </div>

              {(() => {
                const isWin = spWordData.target.split('').every(c => c === ' ' || spGuessed.has(c));
                const isLose = spWrong >= MAX_WRONG;
                
                if (isWin || isLose) {
                  return (
                    <div className="text-center animate-bounce mb-4 w-full">
                      <p className={`text-3xl font-bold mb-4 ${isWin ? 'text-emerald-500' : 'text-red-500'}`}>
                        {isWin ? '🎉 恭喜答對！' : '💀 吊死了！'}
                      </p>
                      {/* 遊戲結束時才顯示原字與解答 */}
                      <div className="bg-slate-50 p-4 rounded-xl mb-6 inline-block w-full max-w-sm">
                        <p className="text-lg text-slate-600 font-bold">解答：{spWordData.text}</p>
                        <p className="text-sm text-slate-400">({spWordData.target})</p>
                      </div>
                      <button onClick={nextSpWord} className="w-full px-6 py-4 bg-indigo-500 hover:bg-indigo-600 text-white font-bold rounded-xl text-lg shadow-md transition">
                        下一題 ➡️
                      </button>
                    </div>
                  );
                }

                // 進行中：虛擬鍵盤
                return (
                  <div className="flex flex-wrap gap-2 justify-center w-full">
                    {keys.map(char => {
                      const isG = spGuessed.has(char);
                      const isCorrect = spWordData.target.includes(char);
                      return (
                        <button key={char} onClick={() => handleSpGuess(char)} disabled={isG}
                          className={`w-9 h-11 sm:w-10 sm:h-12 font-bold rounded text-lg transition-all ${
                            isG 
                              ? (isCorrect ? 'bg-emerald-500 text-white shadow-inner' : 'bg-slate-200 text-slate-400')
                              : 'bg-white border-2 border-slate-300 hover:border-amber-400 text-slate-700 shadow-sm'
                          }`}
                        >
                          {char}
                        </button>
                      )
                    })}
                  </div>
                );
              })()}
            </div>
          )}

          {/* 5. 多人連線大廳登入 */}
          {screen === 'MP_LOGIN' && (
            <div className="w-full bg-white p-6 rounded-2xl shadow-xl space-y-6">
              <h2 className="text-2xl font-bold text-center text-indigo-700 mb-4">🌐 加入 / 建立房間</h2>
              <input type="text" placeholder="您的暱稱" value={playerNameInput} onChange={e => setPlayerNameInput(e.target.value)} className="w-full p-4 border-2 border-slate-200 rounded-xl text-lg font-bold text-center" />
              <input type="text" placeholder="房間號碼 (數字或英文)" value={roomIdInput} onChange={e => setRoomIdInput(e.target.value)} className="w-full p-4 border-2 border-slate-200 rounded-xl text-lg font-bold text-center uppercase" />
              
              <div className="pt-2 flex flex-col gap-3">
                <button onClick={handleJoinRoom} className="w-full py-4 bg-indigo-500 hover:bg-indigo-600 text-white font-bold rounded-xl shadow text-xl transition">加入房間</button>
                <div className="flex gap-2 items-center">
                   <select value={langMode} onChange={e => setLangMode(e.target.value)} className="p-4 border-2 border-slate-200 rounded-xl text-lg font-bold bg-white">
                     <option value="ZH">注音模式</option>
                     <option value="EN">英文模式</option>
                   </select>
                   <button onClick={handleCreateRoom} className="flex-1 py-4 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow text-xl transition">建立新房間</button>
                </div>
              </div>
              <button onClick={() => setScreen('HOME')} className="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition">返回首頁</button>
            </div>
          )}

          {/* 6. 多人遊戲房間 (LOBBY/SETTING/PLAYING/GAME_OVER) */}
          {screen === 'MP_ROOM' && roomData && (
            <div className="w-full bg-white p-4 sm:p-6 rounded-2xl shadow-xl">
              <div className="flex justify-between items-center mb-4 border-b pb-2">
                <div>
                  <h2 className="text-xl font-bold text-indigo-700">房間: {roomData.id} <span className="text-sm bg-slate-200 text-slate-700 px-2 py-1 rounded ml-2">{roomData.langMode === 'ZH' ? '注音' : '英文'}</span></h2>
                  <p className="text-sm text-slate-500 font-bold mt-1">你的暱稱: {playerName}</p>
                </div>
                {playerId === roomData.ownerId && roomData.status === 'LOBBY' && (
                  <button onClick={handleDisbandRoom} className="text-xs bg-red-100 hover:bg-red-200 text-red-600 px-3 py-2 rounded-lg font-bold transition">解散房間</button>
                )}
              </div>

              {/* LOBBY 狀態 */}
              {roomData.status === 'LOBBY' && (
                <div className="space-y-6">
                  <div className="bg-amber-50 p-4 rounded-xl border border-amber-200">
                    <h3 className="font-bold text-amber-800 mb-3 flex items-center gap-2">
                      ⚙️ 房間設定 
                      {playerId !== roomData.ownerId && <span className="text-xs text-amber-600 font-normal">(僅房主可修改)</span>}
                    </h3>
                    <div className="flex flex-col sm:flex-row gap-4">
                      <div className="flex items-center gap-2">
                        <label className="text-sm font-bold text-slate-700">出題時間(秒):</label>
                        <input type="number" min="10" max="120" value={roomData.settings?.timeLimit || 30} onChange={(e) => playerId === roomData.ownerId && firebase.database().ref(`rooms/${roomId}/settings/timeLimit`).set(Number(e.target.value))} disabled={playerId !== roomData.ownerId} className="w-20 p-2 border rounded font-bold" />
                      </div>
                      <div className="flex items-center gap-2">
                        <label className="text-sm font-bold text-slate-700">獲勝分數(分):</label>
                        <input type="number" min="1" max="20" value={roomData.settings?.winScore || 5} onChange={(e) => playerId === roomData.ownerId && firebase.database().ref(`rooms/${roomId}/settings/winScore`).set(Number(e.target.value))} disabled={playerId !== roomData.ownerId} className="w-20 p-2 border rounded font-bold" />
                      </div>
                    </div>
                  </div>

                  <div className="bg-slate-50 p-4 rounded-xl">
                    <h3 className="font-bold mb-3 flex justify-between">玩家列表 <span className="text-indigo-600">{roomData.playerOrder?.length || 0} 人</span></h3>
                    <ul className="space-y-2">
                      {roomData.playerOrder?.map(pid => {
                        const p = roomData.players[pid];
                        if(!p) return null;
                        return (
                          <li key={pid} className="flex justify-between items-center p-3 bg-white rounded-lg shadow-sm border border-slate-100">
                            <span className="font-bold flex items-center gap-2">
                              {pid === roomData.ownerId && '👑'} {p.name} <span className="text-slate-400 text-sm">{pid === playerId && '(您)'}</span>
                            </span>
                            <span className={`px-2 py-1 rounded text-xs font-bold ${p.isReady ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-500'}`}>
                              {p.isReady ? '已準備' : '準備中'}
                            </span>
                          </li>
                        )
                      })}
                    </ul>
                  </div>

                  <div className="flex gap-4">
                    <button onClick={toggleReady} className={`flex-1 py-4 font-bold rounded-xl text-lg shadow transition ${roomData.players?.[playerId]?.isReady ? 'bg-slate-200 text-slate-700 hover:bg-slate-300' : 'bg-emerald-500 text-white hover:bg-emerald-600'}`}>
                      {roomData.players?.[playerId]?.isReady ? '取消準備' : '準備！'}
                    </button>
                    {playerId === roomData.ownerId && (
                      <button onClick={handleStartGame} disabled={!allPlayersReady || roomData.playerOrder?.length < 2} className="flex-1 py-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:text-slate-500 text-white font-bold rounded-xl text-lg shadow transition">
                        開始遊戲
                      </button>
                    )}
                  </div>
                  {playerId === roomData.ownerId && roomData.playerOrder?.length < 2 && (
                     <p className="text-center text-sm text-red-500 font-bold">需要至少兩名玩家才能開始</p>
                  )}
                </div>
              )}

              {/* SETTING / PLAYING / GAME_OVER 共用畫布與計分板 */}
              {roomData.status !== 'LOBBY' && (
                <div className="flex flex-col items-center">
                  {/* 分數板 */}
                  <div className="w-full flex justify-center gap-4 mb-4 text-sm font-bold bg-slate-50 py-3 rounded-xl flex-wrap">
                    {roomData.playerOrder?.map(pid => (
                      <div key={pid} className={`px-3 py-1 rounded-full ${pid === roomData.playerOrder[roomData.setterIndex] ? 'bg-amber-100 text-amber-700 border border-amber-300' : 'text-slate-600'}`}>
                        {roomData.players[pid]?.name}: <span className="text-lg">{roomData.players[pid]?.score || 0}</span>
                      </div>
                    ))}
                  </div>
                  <p className="text-xs text-slate-400 mb-4 font-bold tracking-wider">目標分數: {roomData.settings.winScore} 分</p>

                  {/* 遊戲結束前顯示畫布 */}
                  {roomData.status !== 'GAME_OVER' && (
                     <canvas ref={canvasRef} width="160" height="200" className="bg-amber-50 rounded-xl mb-6 border border-amber-100 shadow-sm"></canvas>
                  )}

                  {/* 出題階段 */}
                  {roomData.status === 'SETTING' && (
                    <div className="w-full max-w-md bg-amber-100 p-6 rounded-xl text-center shadow-inner mt-2">
                      {playerId === roomData.playerOrder[roomData.setterIndex] ? (
                        <div className="space-y-4">
                          <h3 className="text-xl font-bold text-amber-800">換您出題了！</h3>
                          <p className="text-sm text-amber-700 font-bold mb-2">剩餘時間: <span className="text-red-500 text-2xl">{timeLeft}</span> 秒</p>
                          <input type="text" placeholder="原字 (遊戲中不會顯示給猜題者)" value={mpWordText} onChange={e => {
                             setMpWordText(e.target.value);
                             if (roomData.langMode === 'ZH') setMpWordTarget(autoConvertZhuyin(e.target.value));
                          }} className="w-full p-3 border-2 border-white rounded-lg text-center font-bold text-lg focus:border-amber-400 outline-none" />
                          <input type="text" placeholder="目標注音/字母 (以空白分隔)" value={mpWordTarget} onChange={e => setMpWordTarget(e.target.value.toUpperCase())} className="w-full p-3 border-2 border-white rounded-lg text-center font-bold text-lg focus:border-amber-400 outline-none" />
                          <button onClick={handleSubmitMpWord} className="w-full py-4 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-lg shadow-md transition text-lg mt-2">送出題目</button>
                        </div>
                      ) : (
                        <div className="py-10">
                          <h3 className="text-xl font-bold text-slate-700 mb-6">等待 <span className="text-amber-600 text-2xl mx-1">{roomData.players[roomData.playerOrder[roomData.setterIndex]]?.name}</span> 出題中...</h3>
                          <p className="text-4xl font-extrabold text-red-500 animate-pulse">{timeLeft}</p>
                        </div>
                      )}
                    </div>
                  )}

                  {/* 猜題階段 */}
                  {roomData.status === 'PLAYING' && (
                    <div className="w-full flex flex-col items-center">
                      {playerId === roomData.playerOrder[roomData.setterIndex] && (
                        <div className="mb-6 text-center">
                          <span className="bg-amber-200 text-amber-900 px-4 py-2 rounded-full text-sm font-bold shadow-sm">您是出題者，請觀察大家猜測 (您無法點擊鍵盤)</span>
                          <p className="mt-4 text-slate-600 font-bold bg-slate-50 py-2 px-4 rounded-lg inline-block">您的題目：{roomData.wordText} <span className="text-sm font-normal text-slate-400">({roomData.wordTarget})</span></p>
                        </div>
                      )}

                      <div className="flex flex-wrap justify-center gap-2 mb-8">
                        {renderWordSpaces(roomData.wordTarget, new Set(roomData.guessed || []), false)}
                      </div>

                      <div className="flex flex-wrap gap-2 justify-center w-full">
                        {keys.map(char => {
                          const isG = (roomData.guessed || []).includes(char);
                          const isCorrect = roomData.wordTarget.includes(char);
                          const isSetter = playerId === roomData.playerOrder[roomData.setterIndex];
                          
                          return (
                            <button key={char} onClick={() => !isSetter && handleMpGuess(char)} disabled={isG || isSetter}
                              className={`w-9 h-11 sm:w-10 sm:h-12 font-bold rounded text-lg transition-all ${
                                isG 
                                  ? (isCorrect ? 'bg-emerald-500 text-white shadow-inner' : 'bg-slate-200 text-slate-400')
                                  : isSetter 
                                    ? 'bg-slate-100 text-slate-300' 
                                    : 'bg-white border-2 border-slate-300 hover:border-amber-400 hover:bg-amber-50 text-slate-700 shadow-sm cursor-pointer'
                              }`}
                            >
                              {char}
                            </button>
                          )
                        })}
                      </div>
                    </div>
                  )}

                  {/* 遊戲結束結算畫面 */}
                  {roomData.status === 'GAME_OVER' && (
                    <div className="w-full flex flex-col items-center py-6 mt-4">
                      <div className="animate-bounce mb-8">
                        <h2 className="text-5xl font-extrabold text-amber-500 mb-2 drop-shadow-md">🎉 遊戲結束！</h2>
                      </div>
                      
                      <div className="w-full max-w-md bg-white border border-amber-200 shadow-xl rounded-2xl p-8 text-center space-y-6">
                        <h3 className="text-3xl font-black text-slate-800 mb-4">🏆 最終比分 🏆</h3>
                        <div className="space-y-3">
                          {roomData.playerOrder?.map(pid => (
                            <div key={pid} className="flex justify-between items-center bg-slate-50 p-4 rounded-xl font-bold text-xl border border-slate-100">
                              <span className="flex items-center gap-2">
                                {roomData.players[pid]?.score >= roomData.settings.winScore ? '👑' : ''} {roomData.players[pid]?.name}
                              </span>
                              <span className="text-amber-600">{roomData.players[pid]?.score || 0} 分</span>
                            </div>
                          ))}
                        </div>
                        
                        <div className="flex gap-4 pt-6 mt-4 border-t-2 border-dashed border-slate-200">
                          <button onClick={() => setShowReview(true)} className="flex-1 py-4 bg-indigo-100 text-indigo-700 hover:bg-indigo-200 font-bold rounded-xl transition text-lg">📖 回顧歷程</button>
                          {playerId === roomData.ownerId && (
                            <button onClick={() => firebase.database().ref('rooms/' + roomId).update({ status: 'LOBBY', wordHistory: [] })} className="flex-1 py-4 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl transition shadow text-lg">🏠 回到房間</button>
                          )}
                        </div>
                        {playerId !== roomData.ownerId && (
                          <p className="text-sm text-slate-400 pt-2 font-bold animate-pulse">等待房主重啟房間...</p>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
          
          {/* 回顧彈窗 Modal */}
          {showReview && roomData?.wordHistory && (
            <div className="fixed inset-0 bg-slate-900/70 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-3xl w-full max-w-md max-h-[85vh] overflow-y-auto shadow-2xl relative">
                <button onClick={() => setShowReview(false)} className="absolute top-5 right-5 w-8 h-8 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 font-bold transition">✕</button>
                <h2 className="text-2xl font-black mb-6 text-indigo-700 border-b-2 border-indigo-100 pb-3">📖 遊戲回顧紀錄</h2>
                
                {roomData.wordHistory.length === 0 ? (
                  <p className="text-slate-500 text-center py-8 font-bold">目前無任何歷史紀錄</p>
                ) : (
                  <div className="space-y-4">
                    {roomData.wordHistory.map((h, i) => (
                      <div key={i} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 relative shadow-sm">
                        <div className="absolute top-3 right-3 px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-700">第 {i+1} 回合</div>
                        <p className="mb-2 text-sm text-slate-500 font-bold">出題者: <span className="text-slate-800 text-base">{h.setter}</span></p>
                        <p className="mb-3 text-xl font-bold text-slate-800">
                          解答：<span className="text-indigo-600 mr-2">{h.word}</span> 
                          <span className="text-sm text-slate-500 font-normal bg-white px-2 py-1 rounded">({h.target})</span>
                        </p>
                        <div className={`font-bold text-sm inline-block px-3 py-1 rounded-lg ${h.status === '被猜中' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-600'}`}>
                          結果: {h.status} {h.winner ? `(得分者: ${h.winner})` : ''}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
                
                <button onClick={() => setShowReview(false)} className="w-full mt-6 py-4 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl transition text-lg">關閉</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HangmanGame />);
  </script>
</body>
</html>
